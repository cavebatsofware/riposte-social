<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="./favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap"
            rel="stylesheet"
        />
        <title>Riposte Social</title>
        <script>
            // Pre-paint handoff + no-flash theme. Runs before the module bundle
            // (and before i18next/ThemeProvider read localStorage): consume the
            // cross-app ?rs_theme=/?rs_locale= params into localStorage and strip
            // them, then apply the stored (or OS-preferred) theme to <html> so
            // the first paint is correct. Mirrors the design-system handoff
            // helper and ThemeProvider's resolve; the providers re-validate and
            // correct any stale value on mount. Theme key rs_theme_v1, locale
            // key rs_locale_v1, default colorway forest.
            (function () {
                var THEME_KEY = "rs_theme_v1";
                var LOCALE_KEY = "rs_locale_v1";
                try {
                    var params = new URLSearchParams(window.location.search);
                    var t = params.get("rs_theme");
                    var l = params.get("rs_locale");
                    if (t !== null || l !== null) {
                        try {
                            if (t) localStorage.setItem(THEME_KEY, t);
                            if (l) localStorage.setItem(LOCALE_KEY, l);
                        } catch (e) {}
                        params.delete("rs_theme");
                        params.delete("rs_locale");
                        var q = params.toString();
                        var url =
                            window.location.pathname +
                            (q ? "?" + q : "") +
                            window.location.hash;
                        try {
                            window.history.replaceState(window.history.state, "", url);
                        } catch (e) {}
                    }
                } catch (e) {}
                try {
                    var IDS = ["forest","warm","plum","avernus","mineral","daltonia","tritan","achroma"];
                    function valid(id){if(!id)return false;var c=id.slice(-5)==="-dark"?id.slice(0,-5):id;return IDS.indexOf(c)>=0;}
                    // Per-site defaults injected by the backend (serve_social_spa);
                    // unreplaced/empty -> design-system fallback (forest, OS shade).
                    var CW = "__RS_DEFAULT_COLORWAY__"; if (CW.indexOf("__RS_") === 0 || !CW) CW = "forest";
                    var SH = "__RS_DEFAULT_SHADE__"; if (SH.indexOf("__RS_") === 0) SH = "";
                    window.__RS_DEFAULT_COLORWAY__ = CW;
                    window.__RS_DEFAULT_SHADE__ = SH;
                    var stored = null;
                    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
                    var theme;
                    if (valid(stored)) { theme = stored; }
                    else if (SH === "light") { theme = CW; }
                    else if (SH === "dark") { theme = CW + "-dark"; }
                    else {
                        var dark = false;
                        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
                        theme = dark ? CW + "-dark" : CW;
                    }
                    document.documentElement.dataset.theme = theme;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.jsx"></script>
    </body>
</html>
