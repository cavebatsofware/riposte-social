# Reference: https://man.openbsd.org/autoinstall.8

System hostname = riposte-social-vm
Password for root account = riposte
Public ssh key for root account = no
Do you expect to run the X Window System = no

# Network: single virtio-net interface, DHCP from qemu's user-mode NAT.
Which network interface = vio0
IPv4 address for vio0 = dhcp
IPv6 address for vio0 = none
DNS domain name = local

# Disk: single virtio-blk disk, default partitioning is fine for builds.
Which disk is the root disk = sd0
Encrypt the root disk = no
Use (W)hole disk MBR, whole disk (G)PT, or (E)dit = w
Use (A)uto layout, (E)dit auto layout, or create (C)ustom layout = a

# Sets and timezone. Base sets come off the install CD; we don't need
# kernel/games/X11.
Location of sets = cd0
Pathname to the sets = 7.9/amd64
Set name(s) = -all +bsd* +base* +comp* +man*
Continue without verification = yes
What timezone = UTC

