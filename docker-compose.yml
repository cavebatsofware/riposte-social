services:
  # PostgreSQL database for local development. paradedb is a Postgres
  # superset that ships pg_search; we don't use it yet but the image
  # is in place for the planned FTS migration. Note: the on-disk format
  # changed pg16 -> pg18, so the existing `postgres_data` volume is
  # incompatible. Run `make db-reset` (or
  # `docker volume rm riposte-social_postgres_data`) once after pulling.
  postgres:
    image: paradedb/paradedb:0.23.4-pg18
    container_name: riposte-social-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riposte_social}
      POSTGRES_USER: ${POSTGRES_USER:-riposte_social_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18+ expects the volume mount at /var/lib/postgresql so the
      # version-specific data subdirectory (e.g. .../18/) lives inside
      # the volume. Mounting directly at .../data is the legacy pre-18
      # layout and refuses to start under the new image.
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-riposte_social_user} -d ${POSTGRES_DB:-riposte_social}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - riposte-social-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  riposte-social-network:
    driver: bridge
