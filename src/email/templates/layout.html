<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{heading}}</title>
  <style>
    body { margin: 0; background: #f4f4f4; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #333; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #2c3e50; border-radius: 5px 5px 0 0; padding: 20px 24px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 20px; }
    .card { background: #ffffff; border: 1px solid #ddd; border-top: none; border-radius: 0 0 5px 5px; padding: 20px 24px; font-size: 14px; }
    .card p { margin: 0 0 12px; }
    .btn-wrap { text-align: center; margin: 30px 0; }
    .btn { background: #3498db; color: #ffffff !important; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
    .link-fallback { word-break: break-all; color: #3498db; font-size: 14px; }
    pre { padding: 14px; background: #f7f9fb; border: 1px solid #e2e8f0; border-radius: 6px; font-family: Consolas, "SFMono-Regular", monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #33404d; overflow: auto; }
    code { font-family: Consolas, "SFMono-Regular", monospace; }
    .footer { color: #666; font-size: 12px; text-align: center; padding: 16px 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header"><h1>{{heading}}</h1></div>
    <div class="card">{{content}}</div>
    <div class="footer">{{footer}}</div>
  </div>
</body>
</html>
