name: Cargo Audit
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [created]
jobs:
  dependencies:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit vulnerabilities
        run: |
          # Pre-existing advisories tracked in follow-ups, not blockers for this PR:
          #   RUSTSEC-2023-0071 (rsa): no fixed upgrade available upstream
          #   RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101.x): pinned by the
          #     AWS SDK chain (rustls 0.21); needs an aws-sdk-rust bump.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104
