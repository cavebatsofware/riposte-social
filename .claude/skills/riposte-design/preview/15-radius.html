<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 24px 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .item { display: grid; gap: 8px; justify-items: center; }
  .sw { width: 72px; height: 72px; background: var(--color-surface); border: 1px solid var(--color-border); }
  .sm { border-radius: 4px; }
  .md { border-radius: 6px; }
  .lg { border-radius: 10px; }
  .full { border-radius: 999px; background: var(--color-primary); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); }
  .desc { font-size: 11px; color: var(--color-text); text-align: center; }
</style></head>
<body><div class="card">
  <div class="item"><div class="sw sm"></div><div class="tok">--radius-sm · 4</div><div class="desc">Inputs · code</div></div>
  <div class="item"><div class="sw md"></div><div class="tok">--radius-md · 6</div><div class="desc">Buttons · alerts · popovers</div></div>
  <div class="item"><div class="sw lg"></div><div class="tok">--radius-lg · 10</div><div class="desc">Cards · modals · auth shell</div></div>
  <div class="item"><div class="sw full"></div><div class="tok">--radius-full</div><div class="desc">Pills · avatars · chips</div></div>
</div></body></html>
