<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 30px 32px; display: grid; gap: 22px; }
  .wordmark { font-family: var(--font-body); font-weight: 600; font-size: 32px; letter-spacing: -0.01em; color: var(--color-text); }
  .small { font-size: 20px; color: var(--color-text); font-weight: 600; }
  .note { font-size: 12px; color: var(--color-muted); line-height: 1.5; max-width: 580px; }
  .swatch-row { display: flex; gap: 14px; align-items: center; }
  .on-primary { background: var(--color-primary); color: var(--color-on-primary); padding: 12px 16px; border-radius: 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
</style></head>
<body><div class="card">
  <div class="wordmark">Riposte Social</div>
  <div class="swatch-row">
    <div class="small">Riposte Social</div>
    <div class="on-primary">Riposte Social</div>
  </div>
  <div class="note">Riposte has no graphical logo — the wordmark is the brand. Inter 600, <code style="font-family: var(--font-mono); font-size: 11px;">letter-spacing: -0.01em</code>. Header instance sits at 20px; hero / auth page at 32px. Never typeset in all caps; never paired with an icon.</div>
</div></body></html>
