<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Maintainer mark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: 120px 1fr; gap: 22px; align-items: center; }
  img { width: 120px; height: 120px; border-radius: 14px; display: block; }
  .name { font-size: 16px; font-weight: 600; }
  .org { font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); margin-top: 2px; }
  .note { font-size: 12px; color: var(--color-text); line-height: 1.55; margin-top: 10px; max-width: 460px; }
  strong { color: var(--color-danger); }
</style></head>
<body><div class="card">
  <img src="../assets/cavebatsofware-mark.png" alt="cavebatsofware mark" />
  <div>
    <div class="name">cavebatsofware</div>
    <div class="org">Grant DeFayette · maintainer · GitHub org</div>
    <div class="note">The neon-bat-on-circuit-board mark belongs to the <em>maintainer's org</em>, not the Riposte product. It appears on GitHub and on the upstream <code style="font-family: var(--font-mono); font-size: 11px;">landing.html</code> template. <strong>Don't drop it onto Riposte UI.</strong></div>
  </div>
</div></body></html>
