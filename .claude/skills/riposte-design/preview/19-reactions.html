<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Reaction bar</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 26px 28px; display: grid; gap: 22px; }
  .label { font-size: 11px; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .row { display: flex; align-items: center; gap: 12px; }
  .reaction-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--color-muted); font-family: inherit; font-size: 14px; cursor: pointer; }
  .reaction-btn.active { color: var(--color-primary); font-weight: 600; background: var(--color-overlay); }
  .reaction-summary { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--color-muted); }
  .reaction-summary-badge { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; border-radius: 999px; background: var(--color-overlay); }
  .picker { display: inline-flex; align-items: center; padding: 2px 4px; gap: 2px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 999px; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.18); }
  .pick-btn { background: transparent; border: none; cursor: pointer; padding: 4px 8px; border-radius: 999px; font-size: 22px; line-height: 1; font-family: inherit; }
  .pick-btn:hover { background: var(--color-overlay); }
  .pick-btn.active { background: var(--color-overlay); box-shadow: inset 0 0 0 2px var(--color-primary); }
</style></head>
<body><div class="card">
  <div>
    <div class="label" style="margin-bottom: 8px">Default + active summary</div>
    <div class="row">
      <button class="reaction-btn active"><span style="font-size: 1.1em">❤️</span><span>Love</span></button>
      <span class="reaction-summary">
        <span class="reaction-summary-badge"><span>👍</span><span>4</span></span>
        <span class="reaction-summary-badge"><span>❤️</span><span>2</span></span>
        <span class="reaction-summary-badge"><span>😂</span><span>1</span></span>
      </span>
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom: 8px">Picker open</div>
    <div class="picker">
      <button class="pick-btn" title="Like">👍</button>
      <button class="pick-btn active" title="Love">❤️</button>
      <button class="pick-btn" title="Haha">😂</button>
      <button class="pick-btn" title="Wow">😮</button>
      <button class="pick-btn" title="Sad">😢</button>
      <button class="pick-btn" title="Angry">😡</button>
    </div>
  </div>
</div></body></html>
