<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Shadow</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 30px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: end; }
  .demo { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 18px 20px; }
  .demo-card { box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04); }
  .demo-pop  { box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.18); }
  .label { display: flex; justify-content: space-between; font-size: 11px; }
  .label .name { font-weight: 600; color: var(--color-text); }
  .label .tok { font-family: var(--font-mono); color: var(--color-muted); }
  .body { font-size: 12px; color: var(--color-muted); margin-top: 4px; }
</style></head>
<body><div class="card">
  <div class="demo demo-card">
    <div class="label"><span class="name">Card hairline</span><span class="tok">--shadow-card</span></div>
    <div class="body">Restrained 1px wash. Editorial, not floaty. Every feed post and album card.</div>
  </div>
  <div class="demo demo-pop">
    <div class="label"><span class="name">Popover</span><span class="tok">--shadow-popover</span></div>
    <div class="body">Theme picker, language menu, user dropdown, reaction tooltip.</div>
  </div>
</div></body></html>
