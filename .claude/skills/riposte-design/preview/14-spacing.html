<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 22px 28px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 80px 60px 1fr; gap: 16px; align-items: center; font-size: 12px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); }
  .px { color: var(--color-text); font-variant-numeric: tabular-nums; }
  .bar { height: 12px; background: var(--color-primary); border-radius: 3px; }
</style></head>
<body><div class="card">
  <div class="row"><span class="tok">--spacing-1</span><span class="px">4 px</span><div class="bar" style="width: 4px"></div></div>
  <div class="row"><span class="tok">--spacing-2</span><span class="px">8 px</span><div class="bar" style="width: 8px"></div></div>
  <div class="row"><span class="tok">--spacing-3</span><span class="px">12 px</span><div class="bar" style="width: 12px"></div></div>
  <div class="row"><span class="tok">--spacing-4</span><span class="px">16 px</span><div class="bar" style="width: 16px"></div></div>
  <div class="row"><span class="tok">--spacing-6</span><span class="px">24 px</span><div class="bar" style="width: 24px"></div></div>
  <div class="row"><span class="tok">--spacing-8</span><span class="px">32 px</span><div class="bar" style="width: 32px"></div></div>
  <div class="row"><span class="tok">--spacing-12</span><span class="px">48 px</span><div class="bar" style="width: 48px"></div></div>
</div></body></html>
