<!doctype html>
<html lang="en" data-theme="forest"><head><meta charset="utf-8" /><title>Prose specimen</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .card { padding: 24px 28px; max-width: 700px; }
  .body { color: var(--color-text); font-size: 16px; line-height: 1.65; }
  .body p { margin: 0 0 12px; }
  .body a { color: var(--color-primary); text-decoration: none; border-bottom: 1px solid var(--color-link-underline); }
  .body strong { font-weight: 600; }
  .body em { font-style: italic; }
  .body code { font-family: var(--font-mono); font-size: 0.9em; background: var(--color-surface-2); padding: 0.1em 0.3em; border-radius: 4px; }
  .body blockquote { margin: 0 0 12px; padding-left: 16px; border-left: 3px solid var(--color-border); color: var(--color-muted); font-style: italic; }
</style></head>
<body><div class="card">
  <div class="body">
    <p>Thank you everyone for the birthday wishes! I hope you all had a great weekend. We took the dog to the lake and she <em>finally</em> figured out swimming.</p>
    <p>Markdown is rendered server-side; <a href="#">links</a>, <strong>bold</strong>, <em>italic</em>, and inline <code>code</code> all work.</p>
    <blockquote>Own your posts, own your timeline, own your guest list.</blockquote>
  </div>
</div></body></html>
