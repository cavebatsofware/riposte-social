[package]
name = "riposte-social"
version = "0.1.0"
edition = "2021"
authors = ["Grant DeFayette <grant@cavebatsofware.com>"]
description = "A self-hosted social media sharing platform."
repository = "https://github.com/social.cavebatsofware.com/riposte-social"
license = "GPL-3.0-only"

[features]
default = []
e2e_testing = []

[dependencies]
basic-axum-rate-limit = "0.3.0"
regex = "1.12.3"
axum-tower-sessions-csrf = "0.1.3"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tokio = { version = "1.52.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
dotenvy = "0.15.7"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-time", "with-uuid", "macros"] }
sea-orm-migration = "1.1.20"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
thiserror = "2.0.18"
argon2 = "0.5.3"
blake2 = "0.10.6"
rand = "0.10.1"
hex = "0.4.3"
async-trait = "0.1.89"
# Admin authentication dependencies
axum-login = { git = "https://github.com/cavebatsofware/axum-login.git" }
tower-sessions = "0.15"
tower-sessions-sqlx-store = { git = "https://github.com/cavebatsofware/tower-sessions-stores.git", features = ["postgres"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# AWS services. Default features ship a `rustls` feature that pins the
# legacy hyper-rustls 0.24 / rustls 0.21 / rustls-webpki 0.101 chain
# (RUSTSEC-2026-0098/0099/0104). Opt it out and rely on
# `default-https-client`, which routes through aws-smithy-http-client's
# `rustls-aws-lc` feature for the modern rustls + aws-lc-rs backend.
aws-config = "1.8.15"
aws-sdk-sesv2 = { version = "1.117.0", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
aws-sdk-s3 = { version = "1.129.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
# Time for session expiry
time = "0.3.47"
# DOCX handling (ZIP archive manipulation)
zip = "8.5.1"
# TOTP for MFA
totp-rs = { version = "5.7.1", features = ["qr", "gen_secret"] }
# Security hardening
aes-gcm = { version = "0.10.3" }
base64 = { version = "0.22.1" }
# Prometheus metrics
prometheus = "0.14"
# OIDC for Keycloak SSO
openidconnect = "4.0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
url = "2.5.8"
# Markdown rendering + HTML sanitization for post bodies
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
ammonia = "4.1.2"
# Image decoding + resize + webp encoding for avatar uploads. Already a
# transitive dep via the totp-rs QR feature; promoted to a direct dep so
# the contract is explicit.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Bounded-concurrency stream combinators (buffer_unordered) for the import
# worker, plus disk-spooled temp files for staging large archives.
futures = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3.10"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-compat"] }

[dev-dependencies]
riposte-social = { path = ".", features = ["e2e_testing"] }
sqlx = { version = "0.8.6", features = ["migrate"] }
axum-test = "20.0.0"
tower = { version = "0.5.3", features = ["util"] }
totp-rs = { version = "5.7.1", features = ["gen_secret"] }
wiremock = "0.6.5"
urlencoding = "2.1"
aws-smithy-mocks = "0.2.6"
aws-smithy-runtime-api = "1.11.6"
aws-smithy-types = "1.4.7"
aws-sdk-sesv2 = { version = "1.117.0", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
    "test-util",
] }
aws-sdk-s3 = { version = "1.129.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
    "test-util",
] }
rsa = { version = "0.9.10", features = ["pem"] }

