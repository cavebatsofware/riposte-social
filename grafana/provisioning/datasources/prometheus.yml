## Auto-provisions the Prometheus datasource on Grafana boot. Grafana
## reads this file at startup and creates/updates the datasource named
## below; with `editable: true` the dashboard UI can still tweak it
## after the fact.
##
## Both containers run on the host network namespace
## (`--network=host`), so Grafana reaches Prometheus over real
## loopback at port 9090.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
