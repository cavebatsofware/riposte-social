<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="./favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap"
            rel="stylesheet"
        />
        <title>Admin Panel</title>
        <script>
            // Pre-paint no-flash theme. Per-site defaults are injected by the
            // backend (serve_admin_spa) into the placeholders below; unreplaced or
            // empty falls back to the design-system default (forest, OS shade). A
            // stored user choice always wins. Mirrors ThemeProvider's resolve; no
            // value is persisted, so the site default keeps applying until the
            // user picks.
            (function () {
                try {
                    var THEME_KEY = "rs_theme_v1";
                    var IDS = ["forest","warm","plum","avernus","mineral","daltonia","tritan","achroma"];
                    function valid(id){if(!id)return false;var c=id.slice(-5)==="-dark"?id.slice(0,-5):id;return IDS.indexOf(c)>=0;}
                    var CW = "__RS_DEFAULT_COLORWAY__"; if (CW.indexOf("__RS_") === 0 || !CW) CW = "forest";
                    var SH = "__RS_DEFAULT_SHADE__"; if (SH.indexOf("__RS_") === 0) SH = "";
                    window.__RS_DEFAULT_COLORWAY__ = CW;
                    window.__RS_DEFAULT_SHADE__ = SH;
                    var stored = null;
                    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
                    var theme;
                    if (valid(stored)) { theme = stored; }
                    else if (SH === "light") { theme = CW; }
                    else if (SH === "dark") { theme = CW + "-dark"; }
                    else {
                        var dark = false;
                        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
                        theme = dark ? CW + "-dark" : CW;
                    }
                    document.documentElement.dataset.theme = theme;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.jsx"></script>
    </body>
</html>
